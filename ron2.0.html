<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Utama</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #1e293b;
            background-color: #f8fafc;
        }
        header {
            background-color: #0f172a;
            color: #ffffff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.2s;
        }
        nav a:hover {
            color: #ffffff;
        }
        .hero {
            max-width: 800px;
            margin: 5rem auto;
            padding: 0 1.5rem;
            text-align: center;
        }
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #0f172a;
        }
        .hero p {
            font-size: 1.125rem;
            color: #475569;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: #64748b;
            font-size: 0.875rem;
            margin-top: 4rem;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <header>
        <h2>Logo</h2>
        <nav>
            <a href="#beranda">Beranda</a>
            <a href="#fitur">Fitur</a>
            <a href="#kontak">Kontak</a>
        </nav>
    </header>

    <main class="hero">
        <h1>Selamat Datang</h1>
        <p>Tambahkan deskripsi atau konten utama website Anda di bagian ini.</p>
        <a href="#" class="btn">Pelajari Lebih Lanjut</a>
    </main>

    <footer>
        <p>&copy; 2026 nama-brand.com. All rights reserved.</p>
    </footer>
</body>
</html>
