<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jolin Vima - Digital Short Drama Ecosystem</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #090d16;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #8b5cf6;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
            margin-bottom: 16px;
        }

        .profile-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-link {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        .btn-secondary {
            background: rgba(30, 41, 59, 0.8);
            color: #f8fafc;
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
        }

        .btn-link:hover {
            transform: translateY(-2px);
        }

        /* Shine Effect Animation */
        .btn-shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transform: skewX(-20deg);
            animation: shine 3.5s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .footer-text {
            margin-top: 32px;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Section -->
        <img src="https://via.placeholder.com/100" alt="Jolin Vima Profile" class="profile-img" loading="lazy">
        <h1 class="profile-title">Jolin VIMA</h1>
        <p class="profile-subtitle">Ekosistem Drama Pendek Digital & Platform Hiburan Masa Kini</p>

        <!-- CTA Links -->
        <div class="links-group">
            <a href="https://vima.now" target="_blank" rel="noopener" class="btn-link btn-primary btn-shine">
                🚀 Registrasi Akun VIMA
            </a>

            <a href="#" target="_blank" rel="noopener" class="btn-link btn-secondary btn-shine">
                🎬 Tonton Serial Drama Terbaru
            </a>

            <a href="https://wa.me/628XXXXXXXXXX" target="_blank" rel="noopener" class="btn-link btn-whatsapp btn-shine">
                💬 Hubungi via WhatsApp
            </a>
        </div>

        <div class="footer-text">
            &copy; 2026 VIMA Ecosystem. All rights reserved.
        </div>
    </div>

</body>
</html>
